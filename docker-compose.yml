services:
  postgres:
    image: postgres:16-alpine
    container_name: jobcenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: jobcenter
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcenter -d jobcenter"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: jobcenter-redis
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jobcenter-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://jobcenter:${POSTGRES_PASSWORD}@postgres:5432/jobcenter
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      HUNTER_INTERVAL_MS: ${HUNTER_INTERVAL_MS:-300000}
      # Relevance band: how long an un-judged rejected offer is kept before the
      # worker prunes it. The band is a staging area for the LLM's second
      # opinion, not an archive, so this stays short.
      RELEVANCE_BAND_TTL_DAYS: ${RELEVANCE_BAND_TTL_DAYS:-21}
    volumes:
      - pdfdata:/app/data/pdfs
      - ./tailored:/app/tailored:ro
      - ./CV:/app/CV:ro
      - ./Cover_Letter:/app/Cover_Letter:ro
    ports:
      - "${API_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: jobcenter-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8081}:80"

  # Optional: Cloudflare Tunnel — only started if TUNNEL_TOKEN is set
  # Use quick tunnel instead: docker run --rm cloudflare/cloudflared tunnel --url http://host.docker.internal:8081
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jobcenter-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles: ["cloudflare"]

volumes:
  pgdata:
  redisdata:
  pdfdata:
